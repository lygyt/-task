name: Build APK
on:
  pull_request:
  push:
    branches: [ scholarwatch-build, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK and capture log
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          CODE=$?
          cat build.log
          if [ $CODE -eq 0 ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ScholarWatch-v0.1.0.apk
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload APK artifact
        if: steps.build.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScholarWatch-APK
          path: ScholarWatch-v0.1.0.apk
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build.outputs.ok != 'true'
        run: exit 1
